name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, SAST, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - name: Lint and format (ruff, includes security rules)
        run: ruff check . && ruff format --check .
      - name: SAST (bandit)
        run: bandit -q -c pyproject.toml -r app
      - name: Tests, property-based fuzzing, and coverage gate
        run: pytest --cov --cov-report=term-missing --cov-fail-under=95

  image:
    name: Build, smoke test, and scan the container
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and smoke test (AI off; no model in CI)
        run: |
          docker build -t honest-fit:test .
          docker run -d --name app -p 8000:8000 --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -e AI_ENABLED=false honest-fit:test
          for _ in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health
          score=$(curl -sf -X POST http://localhost:8000/api/analyze -H 'Content-Type: application/json' \
            -d '{"job":"Requirements: Python and Docker","resume":"Skills: Python"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["score"])')
          test "$score" = "50"
          curl -sfI http://localhost:8000/ | grep -qi "content-security-policy: default-src 'self'"
          test "$(docker exec app id -u)" = "10001"
          docker rm -f app
      - name: Scan Dockerfile and image (fail on fixable CRITICAL or HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: honest-fit:test
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
