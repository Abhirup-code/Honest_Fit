# Everything in containers: the app, Ollama, and a one-time download of the model.
#   docker compose up
# then open http://127.0.0.1:8000. On a Mac, running Ollama natively is faster (it can use the GPU);
# see the README.
services:
  ollama:
    image: ollama/ollama:0.40.4
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 30

  pull-model:
    image: ollama/ollama:0.40.4
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "llama3.2:3b"]
    depends_on:
      ollama: { condition: service_healthy }
    restart: "no"

  app:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
    ports:
      - "127.0.0.1:8000:8000"   # only reachable from this computer
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      pull-model: { condition: service_completed_successfully }

volumes:
  ollama-models:
